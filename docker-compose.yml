services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rees46
      POSTGRES_USER: rees46
      POSTGRES_PASSWORD: rees46
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rees46 -d rees46"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REES46_POSTGRES_DSN: postgresql://rees46:rees46@postgres:5432/rees46
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
