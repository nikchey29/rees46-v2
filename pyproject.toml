[project]
name = "rees46-v2"
version = "0.1.0"
description = "Production-style behavioral recommendation platform built on the REES46 e-commerce dataset."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "fastapi>=0.128",
    "uvicorn>=0.40",
    "httpx>=0.28",
    "joblib>=1.5",
    "scikit-learn>=1.7",
    "scipy>=1.16",
]


[project.optional-dependencies]
sequence = ["tensorflow>=2.18,<3"]
tracking = ["mlflow>=3,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rees46"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
files = ["src"]
strict = true
pretty = true
show_error_codes = true

[project.scripts]
rees46 = "rees46.cli:main"

[[tool.mypy.overrides]]
module = [
    "joblib",
    "joblib.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true
